key: capsa-info
name: Informació / Aclariment
category: capses
instructions: > 
  Emprau aquesta capsa si voleu fer un comentari o aclariment sobre el que heu
  acabat d'explicar. La capsa inclou un desplegable que podeu activar o desactivar.
template: |
  <p><br></p>
  <!--begin: Capsa informació -->
  <div class="iedib-capsa-info iedib-capsa-{{mida}}" data-lang="{{_lang}}">
    {{#collapsible}}
    <a data-toggle="collapse" data-bs-toggle="collapse" 
     href="#capsa-info-{{ID}}" role="button" aria-expanded="false" aria-controls="capsa-info-{{ID}}" mceNonEditable>{{#I18n}}msg_{{type}}{{/I18n}}&nbsp;</a>
    {{/collapsible}}
    <div id="capsa-info-{{ID}}" class="iedib-central{{#collapsible}} collapse{{/collapsible}}">
      <p>__LOREM__</p>
    </div>
  </div>
  <!--end: Capsa informació -->
  <p><br></p>  
insertquery: .iedib-central
selectors: div.iedib-capsa-info
unwrap: div.iedib-central > *
parameters:
  - __ID__
  - name: mida
    value: gran
    title: Mida de la capsa
    options: 
      - {v: gran, l: Gran}
      - {v: mitjana, l: Mitjana}
      - {v: petita, l: Petita} 
  - name: collapsible
    title: Inclou desplegable?
    value: false 
  - partial: LANG
    when: collapsible
  - name: type
    title: Propòsit de la capsa
    value: info
    when: collapsible
    options:
      - {v: "info", l: "Informació"}
      - {v: "aclar", l: "Aclariment"}
      - {v: "obsv", l: "Observació"}
I18n:
  msg_info:
    ca: Informació
    es: Información
    en: Information
    fr: Information
    de: Information
  msg_aclar:
    ca: Aclariment
    es: Aclaración
    en: Note
    fr: Précision
    de: Erläuterung
  msg_obsv:
    ca: Observació
    es: Observación
    en: Observation
    fr: Remarque
    de: Anmerkung
contextmenu:
  - actions: printable
author: Josep Mulet Pol <pep.mulet@gmail.com>
version: 1.3.0
icon: fa-solid fa-info-circle