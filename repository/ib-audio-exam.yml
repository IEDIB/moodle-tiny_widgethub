key: audio-exam  
name: Audio per a questionaris
category: idiomes
instructions: > 
  Aquest snippet permet incloure un reproductor d'audio segur per a 
  questionaris d'audicions.
template: |
  <p><br></p>
  <!-- begin audio-questionaris -->
  <div class="card shadow-sm border-0 rounded-lg p-3 my-2 bg-light" data-snptd="audio-exam" data-src="{{source}}" data-once="{{once}}">
    <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between">
      <div class="d-flex align-items-center mb-2 mb-sm-0">
        <div class="p-3 bg-info text-white rounded-circle mr-3 me-3 d-flex justify-content-center align-items-center shrink-0" style="width: 44px; height: 44px; min-width: 44px;">
          <span class="fa fa-headphones fa-lg" aria-hidden="true"><span class="sr-only">Audio</span></span>
        </div>
        <div>
          <div class="d-flex align-items-center mb-1">
            <span class="text-uppercase text-info font-weight-bold fw-bold small mr-2 me-2">{{#I18n}}listening{{/I18n}}</span> 
            {{#once}}<span class="badge badge-warning bg-warning text-dark">{{#I18n}}once{{/I18n}}</span>{{/once}}
          </div>
          <p class="mb-0 text-dark small ib-audio-idle"> {{#I18n}}idle{{/I18n}}</p>
          <p class="mb-0 text-primary small font-weight-bold fw-bold d-none ib-audio-playing">
            <span class="fa fa-spinner fa-spin mr-1 me-1"><span class="sr-only">Playing</span></span> {{#I18n}}playing{{/I18n}}.</p>
          <p class="mb-0 text-success small font-weight-bold fw-bold d-none ib-audio-ended">
            <span class="fa fa-check-circle mr-1 me-1"><span class="sr-only">Finished</span></span> {{#I18n}}ended{{/I18n}}.</p>
        </div>
      </div>
      <button type="button" class="btn btn-primary font-weight-bold fw-bold px-4 py-2 shadow-sm" disabled>▶ {{#I18n}}idle2{{/I18n}} </button>
    </div>
    {{#progress}}
      <div class="mt-3 pt-2">
        <div class="progress" style="height: 6px;">
          <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width: 0%;" role="progressbar">&nbsp;</div>
        </div>
      </div>
    {{/progress}}
  </div>
  <!-- end audio-questionaris -->
  <p><br></p>
selectors: div[data-snptd="audio-exam"]
requires:
  url: /sd/audio-exam.min.js
  query: div[data-snptd="audio-exam"]
parameters:
  - name: source
    value: 'https://ibsuite.es/iedib/audible/sample-en02.mp3'
    title: Arxiu d'audio
    type: media 
    bind: attr('data-src')
  - __LANG__
  - name: once
    value: true
    title: Reprodueix només una vegada
    type: checkbox
  - name: progress
    value: true
    title: Inclou barra de progrés?
    type: checkbox
I18n:
  listening:
    en: Listening section
    es: Comprensión oral
    ca: Comprensió oral
    de: Hörverstehen
    fr: Compréhension orale
  once:
    en: Play once
    es: Reproducir una vez
    ca: Reprodueix una vegada
    de: Einmal abspielen
    fr: Lire une seule fois
  idle:
    en: Click button to start audio playback
    es: Haz clic en el botón para iniciar la reproducción de audio
    ca: Fes clic al botó per iniciar la reproducció d'àudio
    de: Klicken Sie auf die Schaltfläche, um die Audiowiedergabe zu starten
    fr: Cliquez sur le bouton pour lancer la lecture audio
  idle2:
    en: Play audio
    es: Reproducir audio
    ca: Reprodueix l'àudio
    de: Audio abspielen
    fr: Lire l'audio
  playing:
    en: Audio is playing. Listen carefully
    es: El audio se está reproduciendo. Escucha atentamente
    ca: S'està reproduint l'àudio. Escolta amb atenció
    de: Audio wird abgespielt. Bitte aufmerksam zuhören
    fr: L'audio est en cours de lecture. Écoutez attentivement
  ended:
    en: Audio finished. Answer questions below
    ca: Àudio finalitzat. Respon a les preguntes de sota
    es: Audio finalizado. Responde a las preguntas de abajo
    de: Audio beendet. Beantworten Sie die folgenden Fragen
    fr: Audio terminé. Répondez aux questions ci-dessous
  started:
    en: Audio started
    es: Audio iniciado
    ca: Àudio iniciat
    de: Audio gestartet
    fr: Audio démarré
author: Josep Mulet Pol <pep.mulet@gmail.com>
version: 1.2.0
icon: fa-solid fa-headphones